<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Observer’s Chamber</title>
    <meta name="description" content="A quiet archive of short thoughts." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308080a'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23e8e4db' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body id="top">
    <script>
      const thoughts = [
        {
          title: "prioritize strategy over mindless hard work",
          date: "2026-11-28",
          essay: "",
        },
        {
          title: "rational iconoclasm deserves admiration",
          date: "2026-11-27",
          essay: [
            "For instance, challenging a commonly supported establishment that has been shown to be harmful to its opponents as well as to its proponents, and whose state is preserved as it is by its authority figures, because keeping it benefits those figures in some ways.",
            "As an iconoclast in this scenario, you might want to supersede the mechanisms that make it harmful, if not replace the establishment itself, but by doing so, you may be faced with genuine ideological and establishment-funded pushback in the form of targeted negative media coverage, as an example, with the aim of sabotaging your reputation and damaging the chances of you successfully engaging more individuals in your cause, which is only one of the many ways that the establishment and its supporters may respond to you contradicting their shared reality.",
            "Therefore, the more powerful the establishment, the riskier it is for someone to rebel against it, and those who do are sufficiently committed to the notion that they've already accepted the risks associated with doing so, and this, from my perspective, naturally positions those human beings as uniquely brave and worthy of respect.",
          ],
        },
        {
          title:
            "think about who you can realistically become, not who you dream to become",
          date: "2026-11-26",
          essay: [
            "Seldom does one make progress when they allocate most of their time and energy towards the non-actionable.",
            "This absence of action whilst in the rumination process is what prevents the crystallization of one's potential that can only transpire through constant motion and active decision-making.",
            "Aligning oneself with what one can realistically do or learn to do well instead of reaching for the assumed unknown is theoretically more likely to produce peace of mind and a sense of pride, even if its finalized impact level on the world is low.",
          ],
        },
        {
          title:
            "the combination of social novelty and minimized social approval maintains psychological satisfaction",
          date: "2026-11-25",
          essay: [""],
        },
        {
          title: "fixate on your objectives, but remain egoless",
          date: "2026-11-25",
          essay: ["", ""],
        },
        {
          title:
            "peak cognitive power is constrained to 4-5 hours of active analytical engagement",
          date: "2026-11-25",
          essay: ["", "", ""],
        },
        {
          title:
            "don't live by clock, live by constructive neurological inclination",
          date: "2026-11-25",
          essay: ["", "", ""],
        },
        {
          title:
            "something outght to be done about the average VC ecosystem favoring pooling founder candidates exclusively from a small list of privately held prestigious institutions",
          date: "2026-11-25",
          essay: ["", "", ""],
        },
        {
          title: "all ideas are nuanced",
          date: "2026-11-25",
          essay: ["", ""],
        },
        {
          title:
            "ego is a psychological obstacle that damages the clarity of one's true destination",
          date: "2026-11-25",
          essay: ["", "", ""],
        },
        {
          title:
            "the prioritization of social validation is a necessary prerequisite for ego development. Therefore, by minimizing the presence of one, you are organically minimizing the existence of the other",
          date: "2026-11-25",
          essay: ["", "", ""],
        },
      ];

      document.addEventListener("DOMContentLoaded", () => {
        const list = document.getElementById("thoughts");
        const dialog = document.getElementById("essay-dialog");
        if (!list || !dialog) return;

        const titleEl = document.getElementById("essay-title");
        const dateEl = document.getElementById("essay-date");
        const bodyEl = document.getElementById("essay-body");
        const scrollEl = dialog.querySelector(".essay-scroll");
        const closeButton = dialog.querySelector(".essay-close");
        const searchInput = document.getElementById("thought-search");
        const countEl = document.getElementById("thought-search-count");
        const clearEl = document.getElementById("thought-search-clear");
        const statusEl = document.getElementById("search-status");
        const emptyEl = document.getElementById("search-empty");
        const archiveEl = document.querySelector(".archive");
        const archiveList = document.getElementById("archive-list");

        const format = new Intl.DateTimeFormat("en-US", {
          month: "short",
          day: "2-digit",
          year: "numeric",
        });

        const formatDate = (iso) => {
          if (!iso) return "—";

          const parsed = new Date(`${iso}T12:00:00`);
          return Number.isNaN(parsed.getTime()) ? iso : format.format(parsed);
        };

        const monthFormat = new Intl.DateTimeFormat("en-US", {
          month: "long",
        });

        const formatMonth = (iso) => {
          const parsed = new Date(`${iso.slice(0, 7)}-01T12:00:00`);
          return Number.isNaN(parsed.getTime())
            ? iso.slice(0, 7)
            : `${monthFormat.format(parsed)}, ${parsed.getFullYear()}`;
        };

        const normalize = (value) => value.toLowerCase().replace(/[’‘]/g, "'");

        let lastTrigger = null;

        const openEssay = (thought, trigger) => {
          lastTrigger = trigger;

          titleEl.textContent = thought.title;
          dateEl.dateTime = thought.date || "";
          dateEl.textContent = formatDate(thought.date);
          bodyEl.replaceChildren(
            ...(thought.essay || []).map((paragraph) => {
              const p = document.createElement("p");
              p.textContent = paragraph;
              return p;
            }),
          );

          dialog.showModal();
          scrollEl.scrollTop = 0;
          document.documentElement.classList.add("dialog-open");
        };

        closeButton.addEventListener("click", () => dialog.close());

        dialog.addEventListener("click", (event) => {
          if (event.target === dialog) dialog.close();
        });

        dialog.addEventListener("close", () => {
          document.documentElement.classList.remove("dialog-open");
          if (lastTrigger) lastTrigger.focus({ preventScroll: true });
          lastTrigger = null;
        });

        const rows = [];
        const months = new Map();

        [...thoughts]
          .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
          .forEach((thought, index) => {
            if (!thought.date) {
              console.warn(`Missing date for thought: ${thought.title}`);
            }

            const month = thought.date ? thought.date.slice(0, 7) : "";

            if (month) {
              const entry = months.get(month) || {
                key: month,
                label: formatMonth(thought.date),
                count: 0,
              };
              entry.count += 1;
              months.set(month, entry);
            }

            const item = document.createElement("li");
            item.className = "thought";
            item.style.setProperty("--i", index);

            const trigger = document.createElement("button");
            trigger.type = "button";
            trigger.className = "thought-trigger";
            trigger.setAttribute("aria-haspopup", "dialog");
            trigger.setAttribute("aria-controls", "essay-dialog");

            const line = document.createElement("span");
            line.className = "line";
            line.textContent = thought.title;

            const date = document.createElement("time");
            date.className = "date";
            if (thought.date) date.dateTime = thought.date;
            date.textContent = formatDate(thought.date);

            trigger.append(line, date);
            trigger.addEventListener("click", () =>
              openEssay(thought, trigger),
            );
            item.append(trigger);
            list.append(item);
            rows.push({ item, title: normalize(thought.title), month });
          });

        let activeMonth = "";

        const applyFilter = () => {
          const terms = normalize(searchInput.value)
            .trim()
            .split(/\s+/)
            .filter(Boolean);
          const filtering = activeMonth !== "" || terms.length > 0;
          let matches = 0;

          rows.forEach(({ item, title, month }) => {
            const match =
              (!activeMonth || month === activeMonth) &&
              terms.every((term) => title.includes(term));
            item.hidden = !match;
            if (match) matches += 1;
          });

          list.classList.add("has-filtered");
          clearEl.hidden = searchInput.value.length === 0;
          countEl.textContent = filtering ? `${matches} / ${rows.length}` : "";
          emptyEl.hidden = !filtering || matches > 0;
          statusEl.textContent = filtering
            ? `${matches} thought${matches === 1 ? "" : "s"} found.`
            : "";
        };

        const setActiveMonth = (month) => {
          activeMonth = activeMonth === month ? "" : month;

          archiveList
            .querySelectorAll(".archive-entry")
            .forEach((entry) =>
              entry.setAttribute(
                "aria-pressed",
                String(entry.dataset.month === activeMonth),
              ),
            );

          applyFilter();
        };

        [...months.values()]
          .sort((a, b) => b.key.localeCompare(a.key))
          .forEach((month) => {
            const item = document.createElement("li");
            const button = document.createElement("button");
            button.type = "button";
            button.className = "archive-entry";
            button.dataset.month = month.key;
            button.setAttribute("aria-pressed", "false");

            const label = document.createElement("span");
            label.className = "archive-label";
            label.textContent = month.label;

            const count = document.createElement("span");
            count.className = "archive-count";
            count.textContent = ` (${month.count})`;

            button.append(label, count);
            button.addEventListener("click", () => setActiveMonth(month.key));
            item.append(button);
            archiveList.append(item);
          });

        if (!months.size) archiveEl.hidden = true;

        searchInput.addEventListener("input", applyFilter);
        searchInput.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && searchInput.value) {
            event.preventDefault();
            searchInput.value = "";
            applyFilter();
          }
        });
        clearEl.addEventListener("click", () => {
          searchInput.value = "";
          applyFilter();
          searchInput.focus();
        });
      });
    </script>

    <header class="masthead">
      <div class="masthead-inner">
        <span class="wordmark">Observer’s Chamber</span>
        <span class="byline">by Igor Savchuk</span>
      </div>
    </header>

    <main class="chamber">
      <aside class="archive" aria-labelledby="archive-title">
        <h2 class="archive-title" id="archive-title">Thought Archive</h2>
        <ul
          class="archive-list"
          id="archive-list"
          aria-label="Filter thoughts by month"
        ></ul>
      </aside>

      <div class="chamber-content">
        <div class="thought-search" role="search">
          <label class="visually-hidden" for="thought-search">
            Search thoughts
          </label>
          <input
            class="thought-search-input"
            id="thought-search"
            type="search"
            placeholder="Search thoughts"
            autocomplete="off"
            spellcheck="false"
            aria-controls="thoughts"
          />
          <span
            class="thought-search-count"
            id="thought-search-count"
            aria-hidden="true"
          ></span>
          <button
            class="thought-search-clear"
            id="thought-search-clear"
            type="button"
            aria-label="Clear search"
            hidden
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
          <p
            class="visually-hidden"
            id="search-status"
            role="status"
            aria-live="polite"
          ></p>
        </div>

        <ul class="thoughts" id="thoughts" aria-label="Thoughts"></ul>
        <p class="search-empty" id="search-empty" hidden>No thoughts found.</p>
        <noscript>
          <p class="no-script">Enable JavaScript to view the archive.</p>
        </noscript>
      </div>
    </main>

    <dialog
      class="essay-dialog"
      id="essay-dialog"
      aria-labelledby="essay-title"
    >
      <article class="essay">
        <div class="essay-head">
          <time class="essay-date" id="essay-date"></time>
          <button class="essay-close" type="button" aria-label="Close essay">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <div class="essay-scroll">
          <div class="essay-content">
            <h2 class="essay-title" id="essay-title"></h2>
            <div class="essay-body" id="essay-body"></div>
          </div>
        </div>
      </article>
    </dialog>

    <a class="to-top" href="#top" aria-label="Back to top">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 19V5" />
        <path d="m5 12 7-7 7 7" />
      </svg>
    </a>
  </body>
</html>
